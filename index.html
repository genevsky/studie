<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Studiehub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css?v=202610031248">
<style>details.instr{background:var(--soft);border-radius:12px;padding:8px 12px}details.instr summary{cursor:pointer;font-weight:800;font-size:.9rem}details.instr .itxt{white-space:pre-wrap;font-size:.9rem;margin-top:8px;line-height:1.5;overflow-wrap:anywhere}.vak{margin-top:22px}.vak h2{display:flex;gap:10px;align-items:center}.ex{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.ex .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{padding:8px 14px;border-radius:999px;font-weight:800;text-decoration:none;font-size:.9rem;background:var(--soft);color:var(--ink)}
.pill.main{background:var(--accent);color:var(--on-accent)}</style></head><body>
<header class="top"><div class="wrap row"><div class="brand"><b>Studiehub</b><span>Al je toetsen op één plek</span></div></div><div class="strata" id="strata" aria-hidden="true"></div></header>
<main class="wrap" id="view"><section class="hero"><h1>Waar ga je vandaag mee aan de slag?</h1><p>Kies een vak en een toets. Je voortgang wordt bewaard in deze browser. Met sync (onderaan) gaat hij mee naar je andere apparaten.</p></section><div id="list"></div><section class="card stack" id="sync" style="margin-top:24px" hidden></section></main>
<script src="assets/sync-config.js?v=202610031248"></script>
<script src="assets/sync.js?v=202610031248"></script>
<script src="catalog.js?v=202610031248"></script>
<script>
(function(){
var HUE=[28,12,352,322,285,240,205,172,140,95];
var st=document.getElementById('strata');st.innerHTML=HUE.map(function(h){return '<i style="background:hsl('+h+' 60% 55%)"></i>'}).join('');
function pct(id){try{var s=JSON.parse(localStorage.getItem('studie:'+id));if(!s)return null;var t=[];if(s.stats&&s.stats.total)t.push(s.stats.seen+'/'+s.stats.total+' '+(s.stats.unit||'')+' geoefend');if(typeof s.pct==='number')t.push('klaar voor de toets: '+s.pct+'%');return t.length?t.join(' · '):null}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function linkify(s){return s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function renderList(){var h='';
CATALOG.forEach(function(v){
 h+='<div class="vak"><h2><span>'+v.emoji+'</span>'+v.vak+'</h2><div class="stack">';
 v.toetsen.forEach(function(t){var p=pct(t.id);
  h+='<div class="card ex"><h3>'+t.titel+'</h3><p class="mut small">'+t.sub+(p?'<br><b style="color:var(--good)">'+p+'</b>':'')+'</p>'+(t.instr?'<details class="instr"><summary>📋 Instructie van de docent</summary><div class="itxt">'+linkify(esc(t.instr))+'</div>'+(t.instrNote?'<p class="small mut">'+esc(t.instrNote)+'</p>':'')+'</details>':'')+'<div class="r"><a class="pill main" href="'+t.url+'">Open studie-app</a>'+(t.pdf?'<a class="pill" href="'+t.pdf+'" target="_blank" rel="noopener">'+(t.pdfLabel||'Spiekbrief')+' (PDF)</a>':'')+'</div></div>'});
 h+='</div></div>'});
document.getElementById('list').innerHTML=h}
renderList();
var SY=window.StudieSync,box=document.getElementById('sync');
function ago(t){if(!t)return 'nog niet';var m=Math.round((Date.now()-t)/60000);return m<1?'net':m<60?m+' min geleden':Math.round(m/60)+' uur geleden'}
function drawSync(){if(!SY||!SY.enabled){box.hidden=true;return}box.hidden=false;var s=SY.status();
 if(!s.code){box.innerHTML='<h2>🔄 Voortgang op al je apparaten</h2><p class="mut small">Met een sync-code gaat je voortgang mee naar je telefoon, laptop of tablet.</p>'+
  '<p class="small"><b>Eerste keer?</b> Kies zelf een code of laat er een maken. Minstens 8 tekens (letters, cijfers, streepjes). Kies iets dat anderen niet raden, dus niet alleen je naam.</p>'+
  '<div class="btns"><input type="text" id="sOwn" placeholder="bijv. zonnebloem-2014-x" autocapitalize="off" autocomplete="off" spellcheck="false" style="flex:1 1 200px"><button class="btn" id="sMine">Deze code gebruiken</button></div>'+
  '<div class="btns"><button class="btn ghost" id="sNew">Maak een code voor mij</button></div>'+
  '<p class="small" style="margin-top:6px"><b>Heb je al een code</b> van een ander apparaat? Typ hem hier:</p><div class="btns"><input type="text" id="sIn" placeholder="jouw code" autocapitalize="off" autocomplete="off" spellcheck="false" style="flex:1 1 200px"><button class="btn ghost" id="sGo">Koppelen</button></div><p class="small" id="sMsg" style="color:var(--bad);font-weight:700"></p>';
  var msg=function(e){document.getElementById('sMsg').textContent=e.message};
  var use=function(v,mode){document.getElementById('sMsg').textContent='';SY.setCode(v,mode).then(drawSync).catch(msg)};
  document.getElementById('sMine').onclick=function(){use(document.getElementById('sOwn').value,'new')};
  document.getElementById('sOwn').addEventListener('keydown',function(e){if(e.key==='Enter')use(this.value,'new')});
  document.getElementById('sNew').onclick=function(){use(SY.newCode(),'new')};
  document.getElementById('sGo').onclick=function(){use(document.getElementById('sIn').value,'join')};
  document.getElementById('sIn').addEventListener('keydown',function(e){if(e.key==='Enter')use(this.value,'join')});return}
 var st=s.busy?'Bezig met synchroniseren…':s.error?'⚠️ Sync lukt nu niet. Je voortgang is veilig in deze browser en gaat mee zodra het weer lukt.':'✓ Gesynchroniseerd '+ago(s.last);
 box.innerHTML='<h2>🔄 Sync staat aan</h2><p class="small">Jouw code: <b style="font-size:1.1rem;letter-spacing:.02em">'+s.code+'</b></p><p class="mut small">Schrijf deze code op! Typ hem op een ander apparaat in om daar verder te gaan. Deel hem niet met anderen: met jouw code zien ze jouw voortgang.</p><p class="small"><b>'+st+'</b></p>'+
  '<div class="btns"><button class="btn ghost" id="sNow">Nu synchroniseren</button><button class="btn ghost" id="sOff">Ontkoppel dit apparaat</button></div>';
 document.getElementById('sNow').onclick=function(){SY.syncNow().then(drawSync)};
 document.getElementById('sOff').onclick=function(){if(document.getElementById('sOff').dataset.sure){SY.forget();drawSync()}else{document.getElementById('sOff').dataset.sure=1;document.getElementById('sOff').textContent='Zeker? Tik nog een keer'}}}
if(SY){SY.onChange(drawSync);window.__studieReload=function(){renderList()}}
drawSync();
})();
</script></body></html>
