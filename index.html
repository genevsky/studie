<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Studiehub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>.vak{margin-top:22px}.vak h2{display:flex;gap:10px;align-items:center}.ex{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.ex .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{padding:8px 14px;border-radius:999px;font-weight:800;text-decoration:none;font-size:.9rem;background:var(--soft);color:var(--ink)}
.pill.main{background:var(--accent);color:var(--on-accent)}</style></head><body>
<header class="top"><div class="wrap row"><div class="brand"><b>Studiehub</b><span>Al je toetsen op één plek</span></div></div><div class="strata" id="strata" aria-hidden="true"></div></header>
<main class="wrap" id="view"><section class="hero"><h1>Waar ga je vandaag mee aan de slag?</h1><p>Kies een vak en een toets. Je voortgang wordt bewaard in deze browser.</p></section><div id="list"></div></main>
<script src="catalog.js"></script>
<script>
(function(){
var HUE=[28,12,352,322,285,240,205,172,140,95];
var st=document.getElementById('strata');st.innerHTML=HUE.map(function(h){return '<i style="background:hsl('+h+' 60% 55%)"></i>'}).join('');
function pct(id){try{var s=JSON.parse(localStorage.getItem('studie:'+id));return s&&typeof s.pct==='number'?s.pct:null}catch(e){return null}}
var h='';
CATALOG.forEach(function(v){
 h+='<div class="vak"><h2><span>'+v.emoji+'</span>'+v.vak+'</h2><div class="stack">';
 v.toetsen.forEach(function(t){var p=pct(t.id);
  h+='<div class="card ex"><h3>'+t.titel+'</h3><p class="mut small">'+t.sub+(p!==null?' · klaar voor de toets: '+p+'%':'')+'</p><div class="r"><a class="pill main" href="'+t.url+'">Open studie-app</a>'+(t.pdf?'<a class="pill" href="'+t.pdf+'" target="_blank" rel="noopener">Spiekbrief (PDF)</a>':'')+'</div></div>'});
 h+='</div></div>'});
document.getElementById('list').innerHTML=h;
})();
</script></body></html>
